name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Créer le projet
        run: |
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MarketplaceApp"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "be.thomas.marketplace"
              compileSdk = 35

              defaultConfig {
                  applicationId = "be.thomas.marketplace"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              // Clé de signature fixe : les mises à jour s'installent par-dessus sans perdre la connexion.
              signingConfigs {
                  getByName("debug") {
                      storeFile = file("debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      // Signe la release avec la clé debug : pratique pour un usage perso (sideload).
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }

              buildFeatures {
                  buildConfig = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.activity:activity-ktx:1.9.3")
          }
          EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Marketplace</string>
          </resources>
          EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:statusBarColor">#FFFFFF</item>
                  <item name="android:windowLightStatusBar">true</item>
              </style>
              <color name="ic_launcher_background">#1877F2</color>
          </resources>
          EOF
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_launcher_foreground.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <!-- Icône simple : une boutique stylisée (store) blanche sur fond bleu. -->
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <!-- Auvent -->
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M34,38 L74,38 L78,50 C78,54 74,56 71,56 C68,56 66,54 65,52 C64,54 62,56 59,56 C56,56 54,54 54,52 C54,54 52,56 49,56 C46,56 44,54 43,52 C42,54 40,56 37,56 C34,56 30,54 30,50 Z" />
              <!-- Boutique -->
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M34,59 L74,59 L74,72 L60,72 L60,63 L48,63 L48,72 L34,72 Z" />
          </vector>
          EOF
          mkdir -p app/src/main/java/be/thomas/marketplace
          cat > app/src/main/java/be/thomas/marketplace/MainActivity.kt <<'EOF'
          package be.thomas.marketplace

          import android.annotation.SuppressLint
          import android.content.ActivityNotFoundException
          import android.content.Intent
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Bundle
          import android.view.Gravity
          import android.webkit.CookieManager
          import android.webkit.JavascriptInterface
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceRequest
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.OnBackPressedCallback
          import androidx.activity.result.contract.ActivityResultContracts
          import org.json.JSONObject

          class MainActivity : ComponentActivity() {

              companion object {
                  const val HOME = "https://www.facebook.com/marketplace/"

                  /** Éléments masqués d'office (liens vers d'autres parties de Facebook). */
                  const val BASE_CSS = """
                      a[href="/"], a[href^="/?"],
                      a[href*="/home.php"], a[href*="/watch"], a[href*="/reel"], a[href*="/stories"],
                      a[href*="/friends"], a[href*="/notifications"], a[href*="/groups"],
                      a[href*="/bookmarks"], a[href*="/menu"], a[href*="/gaming"],
                      [aria-label^="Accueil"], [aria-label^="Home"],
                      [aria-label^="Vidéo"], [aria-label^="Video"], [aria-label^="Watch"], [aria-label^="Reels"],
                      [aria-label^="Amis"], [aria-label^="Friends"],
                      [aria-label^="Notifications"],
                      [aria-label^="Groupes"], [aria-label^="Groups"],
                      [aria-label="Menu"], [aria-label^="Menu,"],
                      [aria-label="Retour"], [aria-label="Back"]
                      { display: none !important; }
                  """

                  /**
                   * Mode « masquer » : le prochain élément touché est masqué (au lieu d'être cliqué)
                   * et son sélecteur est envoyé à l'app, qui le garde en mémoire.
                   */
                  const val PICKER_JS = """
                      (function(){
                        if (window.__mpCancel) window.__mpCancel();
                        var EV = ['pointerup','touchstart','touchend','mousedown','mouseup','click'];
                        var until = 0;
                        function selectorFor(el){
                          var t = el.closest('a,button,[role="button"],[role="tab"],[role="link"],[aria-label]') || el;
                          var lab = t.getAttribute('aria-label');
                          if (lab) return '[aria-label="' + lab.replace(/"/g,'\\"') + '"]';
                          var href = t.tagName === 'A' ? t.getAttribute('href') : null;
                          if (href) return 'a[href="' + href.replace(/"/g,'\\"') + '"]';
                          var path = [], n = t;
                          while (n && n.nodeType === 1 && n !== document.body) {
                            if (n.id) { path.unshift('#' + CSS.escape(n.id)); break; }
                            var i = 1, s = n;
                            while ((s = s.previousElementSibling)) if (s.tagName === n.tagName) i++;
                            path.unshift(n.tagName.toLowerCase() + ':nth-of-type(' + i + ')');
                            n = n.parentElement;
                          }
                          if (n === document.body) path.unshift('body');
                          return path.join(' > ');
                        }
                        function block(e){ if (Date.now() < until) { e.preventDefault(); e.stopImmediatePropagation(); } }
                        function cleanup(){
                          window.removeEventListener('pointerdown', pick, true);
                          EV.forEach(function(t){ window.removeEventListener(t, block, true); });
                          window.__mpCancel = null;
                        }
                        function pick(e){
                          e.preventDefault(); e.stopImmediatePropagation();
                          until = Date.now() + 800;
                          window.removeEventListener('pointerdown', pick, true);
                          setTimeout(cleanup, 900);
                          MPAndroid.hide(selectorFor(e.target));
                        }
                        window.addEventListener('pointerdown', pick, {capture:true, passive:false});
                        EV.forEach(function(t){ window.addEventListener(t, block, {capture:true, passive:false}); });
                        window.__mpCancel = cleanup;
                      })();
                  """
              }

              private lateinit var webView: WebView
              private lateinit var scissors: TextView
              private var picking = false
              private var fileCallback: ValueCallback<Array<Uri>>? = null

              private val prefs by lazy { getSharedPreferences("masquage", MODE_PRIVATE) }

              private val pickFiles =
                  registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { res ->
                      fileCallback?.onReceiveValue(
                          WebChromeClient.FileChooserParams.parseResult(res.resultCode, res.data)
                      )
                      fileCallback = null
                  }

              /** Appelé depuis la page quand on a touché un élément en mode « masquer ». */
              inner class Bridge {
                  @JavascriptInterface
                  fun hide(selector: String) {
                      runOnUiThread {
                          val set = hiddenSelectors().toMutableSet().apply { add(selector) }
                          prefs.edit().putStringSet("selectors", set).apply()
                          injectCss(webView)
                          setPicking(false)
                          Toast.makeText(this@MainActivity, "Masqué ✓", Toast.LENGTH_SHORT).show()
                      }
                  }
              }

              @SuppressLint("SetJavaScriptEnabled", "JavascriptInterface")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  WebView.setWebContentsDebuggingEnabled(BuildConfig.DEBUG)

                  webView = WebView(this)
                  val root = FrameLayout(this)
                  root.addView(webView, FrameLayout.LayoutParams(-1, -1))
                  root.addView(createButtons())
                  setContentView(root)

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      // Retire le marqueur "wv" : Facebook traite mieux un navigateur Chrome standard.
                      userAgentString = userAgentString.replace("; wv", "")
                  }
                  webView.addJavascriptInterface(Bridge(), "MPAndroid")
                  CookieManager.getInstance().apply {
                      setAcceptCookie(true)
                      setAcceptThirdPartyCookies(webView, true)
                  }

                  webView.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(view: WebView, request: WebResourceRequest): Boolean {
                          if (!request.isForMainFrame) return false
                          return handleNavigation(request.url)
                      }

                      // Facebook change de page sans recharger (app « single page ») : on réinjecte le CSS.
                      override fun doUpdateVisitedHistory(view: WebView, url: String?, isReload: Boolean) {
                          super.doUpdateVisitedHistory(view, url, isReload)
                          injectCss(view)
                      }

                      override fun onPageCommitVisible(view: WebView, url: String?) {
                          super.onPageCommitVisible(view, url)
                          injectCss(view)
                      }

                      override fun onPageFinished(view: WebView, url: String?) {
                          super.onPageFinished(view, url)
                          injectCss(view)
                          setPicking(false)
                      }
                  }

                  webView.webChromeClient = object : WebChromeClient() {
                      // Permet d'ajouter des photos quand tu publies une annonce.
                      override fun onShowFileChooser(
                          view: WebView,
                          callback: ValueCallback<Array<Uri>>,
                          params: FileChooserParams,
                      ): Boolean {
                          fileCallback?.onReceiveValue(null)
                          fileCallback = callback
                          return try {
                              pickFiles.launch(params.createIntent())
                              true
                          } catch (e: ActivityNotFoundException) {
                              fileCallback = null
                              false
                          }
                      }
                  }

                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          if (picking) { setPicking(false); return }
                          val list = webView.copyBackForwardList()
                          val prev = if (list.currentIndex > 0) list.getItemAtIndex(list.currentIndex - 1).url else null
                          when {
                              // Page précédente normale → on y retourne
                              prev != null && !isFeed(prev) -> webView.goBack()
                              // Déjà sur l'accueil Marketplace → on quitte (l'app reste en arrière-plan)
                              isMarketplaceHome(webView.url) -> moveTaskToBack(true)
                              // La page précédente serait le fil d'actu → accueil Marketplace à la place
                              else -> webView.loadUrl(HOME)
                          }
                      }
                  })

                  if (savedInstanceState != null) webView.restoreState(savedInstanceState)
                  else webView.loadUrl(HOME)
              }

              // ---------- Boutons flottants : 🏪 retour Marketplace, ✂️ mode « masquer » ----------

              private fun createButtons(): LinearLayout {
                  val d = resources.displayMetrics.density
                  scissors = roundButton("✂️", 0xFF606770.toInt()).apply {
                      setOnClickListener { setPicking(!picking) }
                      setOnLongClickListener {
                          prefs.edit().remove("selectors").apply()
                          Toast.makeText(this@MainActivity, "Tous les éléments masqués sont réaffichés", Toast.LENGTH_LONG).show()
                          webView.reload()
                          true
                      }
                  }
                  val home = roundButton("🏪", 0xFF1877F2.toInt()).apply {
                      setOnClickListener { webView.loadUrl(HOME) }
                  }
                  return LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      addView(scissors)
                      addView(home)
                      layoutParams = FrameLayout.LayoutParams(-2, -2, Gravity.BOTTOM or Gravity.START).apply {
                          setMargins((16 * d).toInt(), 0, 0, (24 * d).toInt())
                      }
                  }
              }

              private fun roundButton(label: String, color: Int): TextView {
                  val d = resources.displayMetrics.density
                  val size = (48 * d).toInt()
                  return TextView(this).apply {
                      text = label
                      textSize = 20f
                      gravity = Gravity.CENTER
                      alpha = 0.85f
                      elevation = 6 * d
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          setColor(color)
                      }
                      layoutParams = LinearLayout.LayoutParams(size, size).apply {
                          setMargins(0, (10 * d).toInt(), 0, 0)
                      }
                  }
              }

              private fun setPicking(on: Boolean) {
                  if (!::scissors.isInitialized || picking == on) return
                  picking = on
                  (scissors.background as GradientDrawable).setColor(
                      if (on) 0xFFE41E3F.toInt() else 0xFF606770.toInt()
                  )
                  if (on) {
                      webView.evaluateJavascript(PICKER_JS, null)
                      Toast.makeText(this, "Touche l'élément à masquer", Toast.LENGTH_SHORT).show()
                  } else {
                      webView.evaluateJavascript("window.__mpCancel && window.__mpCancel();", null)
                  }
              }

              private fun isFeed(url: String?): Boolean {
                  val path = Uri.parse(url ?: return false).path.orEmpty()
                  return path == "" || path == "/" || path.startsWith("/home.php")
              }

              private fun isMarketplaceHome(url: String?): Boolean =
                  Uri.parse(url ?: return false).path.orEmpty().trimEnd('/') == "/marketplace"

              private fun hiddenSelectors(): Set<String> =
                  prefs.getStringSet("selectors", emptySet()) ?: emptySet()

              // ---------- Navigation ----------

              /** true = on gère nous-mêmes, false = le WebView charge normalement. */
              private fun handleNavigation(uri: Uri): Boolean {
                  val host = uri.host.orEmpty()
                  return when {
                      // Liens sortants de Facebook (l.facebook.com/l.php?u=...) → navigateur externe
                      host == "l.facebook.com" || host == "lm.facebook.com" -> {
                          openExternal(uri.getQueryParameter("u")?.let(Uri::parse) ?: uri); true
                      }
                      host == "facebook.com" || host.endsWith(".facebook.com") -> false
                      uri.scheme == "http" || uri.scheme == "https" -> { openExternal(uri); true }
                      else -> true // intent:, fb:// … ignorés (évite d'ouvrir l'app Facebook)
                  }
              }

              private fun openExternal(uri: Uri) {
                  try {
                      startActivity(Intent(Intent.ACTION_VIEW, uri))
                  } catch (e: ActivityNotFoundException) {
                      // aucun navigateur installé : on ignore
                  }
              }

              private fun injectCss(view: WebView) {
                  val css = BASE_CSS + hiddenSelectors().joinToString("\n") { "$it { display: none !important; }" }
                  val quoted = JSONObject.quote(css)
                  view.evaluateJavascript(
                      """
                      (function() {
                        var s = document.getElementById('mp-only-css');
                        if (!s) { s = document.createElement('style'); s.id = 'mp-only-css';
                                  (document.head || document.documentElement).appendChild(s); }
                        s.textContent = $quoted;
                      })();
                      """.trimIndent(),
                      null
                  )
              }

              override fun onSaveInstanceState(outState: Bundle) {
                  super.onSaveInstanceState(outState)
                  webView.saveState(outState)
              }

              override fun onPause() {
                  super.onPause()
                  CookieManager.getInstance().flush() // garde la session Facebook
                  webView.onPause()
              }

              override fun onResume() {
                  super.onResume()
                  webView.onResume()
              }
          }
          EOF
